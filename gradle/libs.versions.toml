# Every version here was resolved from a live repository, never from memory.
# See CLAUDE.md §4 ("Version numbers") and docs/decisions.md ADR-011, ADR-014.
#
# Resolved 2026-08-20 from:
#   dl.google.com/dl/android/maven2/.../maven-metadata.xml   (AndroidX, AGP)
#   repo1.maven.org/maven2/.../maven-metadata.xml            (Dagger, KSP, kotlinx)
#   plugins.gradle.org/m2/...                                (plugin markers)
#
# Pre-release versions were filtered out deliberately: several artifacts here have a newer
# alpha/beta/rc (datastore 1.3.0-alpha10, navigation 2.10.0-rc01, lifecycle 2.12.0-alpha01,
# work 2.12.0-rc01). This project pins stable only.
#
# THREE VERSIONS ARE CONSTRAINED, NOT SIMPLY "LATEST" — do not bump them in isolation:
#   kotlin  2.2.10        the KGP version AGP 9.3.1 itself ships; AGP 9 compiles Kotlin. ADR-011.
#   ksp     2.2.10-2.0.2  KSP's version prefix MUST equal the Kotlin version. The newest KSP is
#                         2.3.11, which is for Kotlin 2.3.x and will refuse to run here. ADR-011.
#   ktor    3.3.3         NOT the newest (3.5.2). Ktor 3.4.0 moved to kotlin-stdlib 2.3.x, and
#                         Gradle resolves the stdlib UP — handing a 2.2.10 compiler metadata it
#                         cannot read. 3.3.3 is the last release still on Kotlin 2.2.x. It moves
#                         when Kotlin moves, and Kotlin moves as a trio. ADR-039.

[versions]
agp = "9.3.1"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"

androidxCore = "1.19.0"
androidxLifecycle = "2.11.0"
androidxActivity = "1.13.0"
composeBom = "2026.08.00"

hilt = "2.60.1"
androidxHilt = "1.4.0"
room = "2.8.4"
datastore = "1.2.1"
navigation = "2.9.8"
# Resolved live 2026-08-23 from dl.google.com. Newest overall is 2.12.0-rc01; this
# catalog pins stable only, and 2.11.2 is the newest stable. See the header.
work = "2.11.2"
coroutines = "1.11.0"
serializationJson = "1.11.0"
# Resolved live 2026-08-22 from repo1.maven.org. Latest stable is 3.5.2 — see the header for
# why this is not that. All four ktor-* artifacts below share this version by construction:
# mixing Ktor module versions is unsupported.
ktor = "3.3.3"

detekt = "1.23.8"
ktlint = "1.8.0"
ktlintGradle = "14.2.0"

junit = "4.13.2"
turbine = "1.2.1"
mockk = "1.14.11"
androidxTestJunit = "1.3.0"
# Pinned explicitly to override what Compose UI test drags in transitively — see ADR-018.
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
# The Hilt/WorkManager bridge: @HiltWorker and HiltWorkerFactory. Its processor is androidx's
# own hilt-compiler, which is a DIFFERENT artifact from Dagger's hilt-android-compiler above —
# both are needed, and leaving this one out fails at runtime rather than at build time.
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

# The Notion client. data/remote/notion is the ONLY package allowed to use these (CLAUDE.md §6).
# There is deliberately NO ktor-client-logging here yet: CLAUDE.md §3.6 requires the Authorization
# header to be redacted BEFORE logging is switched on at any level, and that redaction is built in
# M4.5. Adding the artifact first is how a token ends up in logcat.
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
