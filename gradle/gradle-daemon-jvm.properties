# Pins the JVM that runs the Gradle daemon, so the IDE and a plain terminal always
# build on the same JDK regardless of JAVA_HOME or PATH. See docs/decisions.md ADR-013.
#
# Originally generated by `updateDaemonJvm` at version 25, which made Gradle auto-download
# Temurin 25. Repinned by hand to 21 — the JDK already installed here, and the version
# Android Studio itself bundles. The toolchainUrl.* auto-provisioning entries are omitted
# deliberately: they exist only for machines without a matching JDK, and regenerating them
# requires the foojay-resolver plugin, which this project has not adopted.
toolchainVersion=21
