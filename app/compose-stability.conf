// Compose stability configuration — M13.5, ADR-112.
//
// ⚠⚠ WHY THIS FILE EXISTS RATHER THAN @Immutable ANNOTATIONS
//
// Every type below is truthfully immutable, and none of them may say so in Kotlin. CLAUDE.md §5
// makes domain/model "pure Kotlin, no Android", and Habit's own KDoc records that no Compose type
// reaches that package — but @Immutable lives in androidx.compose.runtime. This file is the Compose
// compiler's own answer to exactly that: a list of classes to treat as stable, with no annotation on
// the class and no dependency added to the module it lives in.
//
// ⚠⚠ WHAT IT BUYS, AND WHY "ALREADY SKIPPABLE" WAS NOT ENOUGH
//
// Strong skipping (default since Kotlin 2.0.20) makes a composable skippable even with unstable
// parameters — but it then compares those parameters by INSTANCE rather than by equals. So a value
// that is rebuilt-but-equal defeats skipping exactly as a changed value would.
//
// GetHabitsForWeek does `habitList.map { buildPeriod(...) }` on every emission, so checking one
// habit off hands the other four cards equal-but-fresh HabitPeriods. RecompositionCostTest measures
// that (== and !==). Listing these types turns that comparison into equals(), and four needless
// recompositions per tap on the app's core loop go away.
//
// ⚠⚠ THIS IS A PROMISE, NOT A PROOF. The compiler takes this file's word and checks nothing. A
// mutable field, or a List that someone starts mutating in place, would make a stale frame rather
// than a compile error — and stale frames are the worst class of bug to find. Add a line here only
// for a type whose every field is a val of an immutable type, and say why below.
//
// ⚠ Verify with the compiler report, never by reading this file back:
//     composeCompiler { reportsDestination = layout.buildDirectory.dir("compose-reports") }
// then check app-classes.txt moves the type from `unstable` to `stable`. A typo here fails silently.

// --- domain/model: pure Kotlin by rule, so annotation is not available -------------------------
// Each is a data class of vals over primitives, enums, java.time values and other entries in this
// list. The Lists they hold are built by `map` in a use case and never mutated afterwards.
com.cristianprincipi.habits.domain.model.Habit
com.cristianprincipi.habits.domain.model.HabitId
com.cristianprincipi.habits.domain.model.Completion
com.cristianprincipi.habits.domain.model.Day
com.cristianprincipi.habits.domain.model.DiscardedEditNotice
com.cristianprincipi.habits.domain.model.HabitPeriod
com.cristianprincipi.habits.domain.model.MonthlyCompletions

// --- domain/usecase: the shapes a use case returns to a screen ---------------------------------
// Not the use cases themselves — those are injected singletons and never a composable parameter.
com.cristianprincipi.habits.domain.usecase.HabitStats
com.cristianprincipi.habits.domain.usecase.HabitYear

// --- java.time: immutable by specification, and the JDK cannot be annotated --------------------
// `LocalDate` and `YearMonth` are final, value-based and documented immutable. They appear directly
// in WeekUiState.Content and MonthUiState.Content, so leaving them out would keep those unstable
// however the rest of this file is written.
java.time.LocalDate
java.time.YearMonth