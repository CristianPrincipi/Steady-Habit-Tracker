org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# KSP 2.2.10-2.0.2 registers its generated sources through `kotlin.sourceSets`, which AGP 9's
# built-in Kotlin rejects by default. There is no newer KSP for Kotlin 2.2.10 — KSP dropped the
# `<kotlin>-<ksp>` scheme at 2.3.0 and its current releases need Kotlin 2.3.x, which ADR-011 rules
# out. This is AGP's own documented escape hatch. See docs/decisions.md ADR-014.
android.disallowKotlinSourceSets=false
